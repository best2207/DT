<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>外贸风控情报看板</title><style>
:root{--bg:#f3f6fa;--ink:#172b3a;--muted:#637381;--blue:#17324d;--line:#dbe3eb;--red:#b42318;--amber:#9a6700}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,"Microsoft YaHei",sans-serif}header{background:var(--blue);color:white;padding:24px max(20px,calc((100vw - 1180px)/2))}h1{margin:0;font-size:24px}header p{margin:4px 0 0;color:#d7e2ec}.wrap{max-width:1180px;margin:22px auto;padding:0 18px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card,.item{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px}.stat{font-size:26px;font-weight:700}.muted{color:var(--muted);font-size:13px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.toolbar input,.toolbar select{border:1px solid var(--line);background:white;border-radius:8px;padding:10px;font:inherit}.toolbar input{flex:1;min-width:220px}.list{display:grid;gap:10px}.item h2{font-size:17px;margin:0 0 7px}.item a{color:#174f78;text-decoration:none}.item a:hover{text-decoration:underline}.meta{display:flex;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:12px}.badge{font-weight:700}.P1{color:var(--red)}.P2{color:var(--amber)}.empty{padding:30px;text-align:center;color:var(--muted)}footer{margin:24px 0;color:var(--muted);font-size:12px}@media(max-width:650px){.stats{grid-template-columns:repeat(2,1fr)}header{padding:20px}.wrap{margin:14px auto}}
</style></head><body><header><h1>外贸风控情报看板</h1><p>公开政策、贸易事件与企业风险线索</p></header><main class="wrap"><section class="stats" id="stats"></section><section class="toolbar"><input id="q" placeholder="搜索事件、企业、来源"><select id="level"><option value="">全部等级</option><option>P1</option><option>P2</option><option>P3</option></select><select id="china"><option value="">涉华状态</option><option value="yes">涉华</option><option value="no">非涉华</option></select></section><section class="list" id="list"><div class="empty">正在读取监控数据…</div></section><footer id="status"></footer></main><script>
const esc=s=>String(s??"");const date=s=>s?new Date(s).toLocaleString():"时间未提供";let events=[];let state={};function render(){let q=document.querySelector('#q').value.toLowerCase(),lev=document.querySelector('#level').value,ch=document.querySelector('#china').value;let rows=events.filter(e=>{let hay=[e.title,e.source,...(e.matched_companies||[]).map(x=>x.name)].join(' ').toLowerCase();return(!q||hay.includes(q))&&(!lev||e.risk_level===lev)&&(!ch||(ch==='yes')===!!e.china_related)});document.querySelector('#list').innerHTML=rows.length?rows.map(e=>{const card=document.createElement('article');card.className='item';const safeUrl=/^https?:\/\//i.test(e.url||'')?e.url:'#';card.innerHTML=`<h2><a target="_blank" rel="noopener" href="${encodeURI(safeUrl)}"></a></h2><div class="meta"></div>`;card.querySelector('h2 a').textContent=esc(e.title);const names=(e.matched_companies||[]).map(x=>x.name).join(', ')||'未匹配监控企业';card.querySelector('.meta').textContent=`${e.risk_level} · ${e.china_related?'涉华':'非涉华'} · ${e.source||'未知来源'} · ${date(e.published||e.fetched_at)} · ${names}`;return card.outerHTML}).join(''):'<div class="card empty">没有符合条件的事件</div>';}
document.querySelectorAll('.toolbar input,.toolbar select').forEach(x=>x.addEventListener('input',render));Promise.all([fetch('./data/events.json').then(r=>r.ok?r.json():[]),fetch('./data/state.json').then(r=>r.ok?r.json():{})]).then(([e,s])=>{events=e;state=s;document.querySelector('#stats').innerHTML=[['监控事件',s.events_total||events.length],['新告警',s.new_alerts||0],['监控企业',s.companies_monitored||0],['数据源',Object.keys(s.sources||{}).length]].map(([k,v])=>`<div class="card"><div class="stat">${Number(v)}</div><div class="muted">${k}</div></div>`).join('');document.querySelector('#status').textContent=`最近运行：${date(s.updated_at)}；数据由 GitHub Actions 定时更新。`;render()}).catch(()=>{document.querySelector('#list').innerHTML='<div class="card empty">暂无数据。先在 GitHub Actions 手动运行 Trade risk monitor。</div>'});
</script></body></html>
